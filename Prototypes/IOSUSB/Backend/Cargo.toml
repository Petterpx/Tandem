[package]
name = "tandem-ios-usb"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
idevice = { path = "../../../build/ios-usb-native/vendor/idevice/idevice", default-features = false, features = ["ring", "usbmuxd", "core_device_proxy", "core_device", "display_stream", "tunnel_tcp_stack", "rsd"] }
ns-keyed-archive = "0.1.5"
plist = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }
