<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MagicDevX 无线配对</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0058bd}a:hover{color:#00408a}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #cdd2da; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif; color: #1d1d1f; display: flex; align-items: center; justify-content: center">

<div style="width: 820px; box-sizing: border-box; background: #f5f5f7; border-radius: 12px; border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 24px 60px rgba(0,0,0,0.3); overflow: hidden; display: flex; flex-direction: column">

<div style="height: 44px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: #ececef; border-bottom: 1px solid #d6d6db">
<a href="Main.dc.html" aria-label="关闭" style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; border: 0.5px solid rgba(0,0,0,0.15)"></a>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #d5d5da" aria-hidden="true"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #d5d5da" aria-hidden="true"></span>
<span style="flex-grow: 1; text-align: center; font-size: 13px; font-weight: 600; margin-right: 52px">无线配对 Android 设备</span>
</div>

<div style="display: flex; gap: 0">

<div style="flex: 1 1 0; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; border-right: 1px solid #e0e0e5">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600">扫码配对</span>
<span style="font-size: 12px; color: #5e5e64">适用于 Android 11 及以上，手机与 Mac 需在同一 Wi-Fi 下</span>
</div>
<div style="display: flex; gap: 22px; align-items: flex-start">
<div role="img" aria-label="配对二维码示意" style="width: 200px; height: 200px; flex-shrink: 0; box-sizing: border-box; padding: 12px; background: #ffffff; border-radius: 10px; border: 1px solid #e0e0e5">
<div style="width: 176px; height: 176px; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr))">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="625">
<span style="background: {{c.bg}}"></span>
</sc-for>
</div>
</div>
<ol style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.5">
<li>手机打开 开发者选项 → 无线调试</li>
<li>点「使用二维码配对设备」</li>
<li>扫描左侧二维码，配对后自动连接</li>
</ol>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #eef5ff; border: 1px solid #c9ddf7; font-size: 13px; color: #1f3d66">
<span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 2px solid #9cc2f0; border-top-color: #0062cc"></span>
<span>正在等待设备…</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; color: #5e5e64">或手动输入配对码</span>
<div style="display: flex; gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #5e5e64; flex: 2 1 0">IP 地址与端口<input type="text" placeholder="192.168.1.23:37155" style="height: 30px; box-sizing: border-box; padding: 0 10px; border-radius: 7px; border: 1px solid #cfcfd6; font-size: 12px; font-family: 'SF Mono', ui-monospace, Menlo, monospace"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #5e5e64; flex: 1 1 0">配对码<input type="text" placeholder="6 位数字" style="height: 30px; box-sizing: border-box; padding: 0 10px; border-radius: 7px; border: 1px solid #cfcfd6; font-size: 12px; font-family: 'SF Mono', ui-monospace, Menlo, monospace"></label>
</div>
<button type="button" style="align-self: flex-start; height: 30px; padding: 0 14px; border-radius: 7px; border: 1px solid #cfcfd6; background: #ffffff; font-size: 12px; font-family: inherit">配对</button>
</div>
</div>

<div style="width: 300px; flex-shrink: 0; padding: 24px 22px; display: flex; flex-direction: column; gap: 14px; background: #fbfbfd">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600">一键转无线</span>
<span style="font-size: 12px; color: #5e5e64">对已用 USB 连接的设备切换为 Wi-Fi 连接，之后可以拔线</span>
</div>
<div style="display: flex; flex-direction: column; border: 1px solid #e3e3e8; border-radius: 10px; background: #ffffff; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid #f0f0f3">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #1f9d4c"></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px">Pixel 8</span><span style="font-size: 11px; color: #5e5e64">USB · Android 15</span></span>
<button type="button" style="height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid #0062cc; background: #0062cc; color: #ffffff; font-size: 12px; font-family: inherit">转为无线</button>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px; opacity: 0.6">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #d08a00"></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px">Galaxy S23</span><span style="font-size: 11px; color: #5e5e64">未授权 · 先在手机上允许调试</span></span>
<button type="button" disabled style="height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid #cfcfd6; background: #ffffff; font-size: 12px; font-family: inherit">转为无线</button>
</div>
</div>
<span style="font-size: 11px; color: #5e5e64; line-height: 1.5">iOS 设备仅支持 USB 连接，不在此列出。无线连接时默认降低码率与分辨率以保证流畅。</span>
<div style="flex-grow: 1"></div>
<a href="Main.dc.html" style="align-self: flex-end; height: 30px; padding: 0 16px; border-radius: 7px; background: #ffffff; border: 1px solid #cfcfd6; color: #1d1d1f; font-size: 12px; display: flex; align-items: center; text-decoration: none">完成</a>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 25;
    const finder = (r, c, r0, c0) => {
      const y = r - r0, x = c - c0;
      if (y < 0 || y > 6 || x < 0 || x > 6) return null;
      if (y === 0 || y === 6 || x === 0 || x === 6) return true;
      if (y >= 2 && y <= 4 && x >= 2 && x <= 4) return true;
      return false;
    };
    const cells = [];
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        let on = finder(r, c, 0, 0);
        if (on === null) on = finder(r, c, 0, n - 7);
        if (on === null) on = finder(r, c, n - 7, 0);
        if (on === null) {
          const nearFinder = (r < 8 && c < 8) || (r < 8 && c > n - 9) || (r > n - 9 && c < 8);
          on = nearFinder ? false : ((r * 7 + c * 13 + r * c * 3) % 5) < 2;
        }
        cells.push({ bg: on ? '#1d1d1f' : '#ffffff' });
      }
    }
    return { cells: cells };
  }
}
</script>
</body>
</html>
