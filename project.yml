name: Tandem
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  TandemCore:
    path: Packages/TandemCore
schemes:
  Tandem:
    build:
      targets:
        Tandem: all
    test:
      targets:
        - TandemTests
targets:
  TandemTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: Tandem
      - package: TandemCore
        product: DeviceCore
      - package: TandemCore
        product: MediaKit
      - package: TandemCore
        product: ControlProtocol
      - package: TandemCore
        product: MCPBridge
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
  tandem-mcp:
    type: tool
    platform: macOS
    sources:
      - path: MCP
    dependencies:
      - package: TandemCore
        product: MCPBridge
      - package: TandemCore
        product: ControlProtocol
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
  Tandem:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Vendor
      - path: App/Resources/Vendor
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSLocalNetworkUsageDescription: 用于通过 Wi-Fi 发现并连接调试中的 Android 设备
        NSBonjourServices:
          - _adb-tls-pairing._tcp
          - _adb-tls-connect._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tandem.Tandem
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - package: TandemCore
        product: DeviceCore
      - package: TandemCore
        product: AndroidDriver
      - package: TandemCore
        product: MediaKit
      - package: TandemCore
        product: ControlProtocol
      - package: TandemCore
        product: MCPBridge
      - target: tandem-mcp
        copy:
          destination: executables
    preBuildScripts:
      - name: Check vendor binaries
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "$SRCROOT/App/Resources/Vendor/adb" ] || [ ! -f "$SRCROOT/App/Resources/Vendor/scrcpy-server-v5.0.1" ]; then
            echo "error: 请先运行 scripts/fetch-vendor.sh"
            exit 1
          fi
