name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并上传的已有 release tag（例如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TANDEM_BUILD_IOS_USB_HELPER: "1"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "27"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust for native iPhone USB support
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: "1.100.0"

      - name: Fetch vendor binaries (adb, scrcpy-server)
        run: scripts/fetch-vendor.sh

      - name: Run TandemCore tests
        working-directory: Packages/TandemCore
        # 录屏编码测试依赖真实的硬件编码器启动速度，在 GitHub 虚拟机上会丢掉开头的帧，这里跳过；本机仍会跑
        run: swift test --skip recordsAcrossRotationIntoFirstFrameCanvas

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run App tests
        run: |
          xcodebuild test -project Tandem.xcodeproj -scheme Tandem \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/Tandem-tests"

      - name: Build Release
        run: |
          xcodebuild -project Tandem.xcodeproj -scheme Tandem \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build CODE_SIGN_IDENTITY=- build

      - name: Verify bundle contents
        run: |
          APP=build/Build/Products/Release/Tandem.app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          test "v${VERSION}" = "$TAG"
          test -x "$APP/Contents/MacOS/tandem-mcp"
          test -x "$APP/Contents/Resources/Vendor/adb"
          test -f "$APP/Contents/Resources/Vendor/scrcpy-server-v5.0.1"
          test -x "$APP/Contents/MacOS/tandem-ios-usb"
          test -f "$APP/Contents/Resources/IOSUSBLicenses/idevice-LICENSE.txt"
          test -f "$APP/Contents/Resources/IOSUSBLicenses/Dependencies/index.json"
          codesign --verify --deep --strict "$APP"
          if [ "$(uname -m)" = "arm64" ]; then
            test -x "$APP/Contents/MacOS/tandem-simulator"
            test -d "$APP/Contents/MacOS/CoreSimulatorStub.framework"
            test -d "$APP/Contents/MacOS/AccessibilityPlatformTranslationStub.framework"
            test -d "$APP/Contents/Resources/SimulatorLicenses"
            test -x "$APP/Contents/Resources/Simulator/tandem-simulator-text"
          fi

      - name: Package
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/Tandem.app "Tandem-${TAG}.zip"
          shasum -a 256 "Tandem-${TAG}.zip" > "Tandem-${TAG}.zip.sha256"
          cat "Tandem-${TAG}.zip.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "Tandem-${TAG}.zip" "Tandem-${TAG}.zip.sha256" --clobber
